version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gosec
    - errorlint
    - bodyclose
    - noctx
  settings:
    gosec:
      excludes:
        - G104 # duplicates errcheck

formatters:
  enable:
    - gofmt
    - goimports
